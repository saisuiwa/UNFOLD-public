<!doctype html><meta charset="utf-8"><title>UNFOLD lyric motion checks</title><style>body{background:#142020;color:white;font:16px system-ui}canvas{width:640px;max-width:95vw}pre{white-space:pre-wrap}</style><h1>歌詞モーションの描画検証</h1><canvas id="stage"></canvas><pre id="results">検証中</pre><script type="module">
const results=[];window.qaResults=results;const test=(name,pass)=>results.push({name,pass:!!pass});try{
const T=await import('/app/vendor/three.module.min.js');const {parseLyrics}=await import('/app/lyric-document.js');const {assignLyricMotions}=await import('/app/lyric-motion.js');const {createLyricOverlay}=await import('/app/lyric-overlay.js');
const r=new T.WebGLRenderer({canvas:document.querySelector('canvas'),preserveDrawingBuffer:true});r.setSize(640,360,false);r.setClearColor('#142020');const o=createLyricOverlay(r);let d=assignLyricMotions(parseLyrics('[Chorus]\n*空*へ飛ぶ'),{style:'pop',seed:7});d.events[1].s=0;d.events[1].e=5;await o.prepare(d);const pixels=()=>{const a=new Uint8Array(640*360*4);r.getContext().readPixels(0,0,640,360,6408,5121,a);return a};const draw=t=>{r.clear();o.render(d,t,{duration:6,bpm:120,width:640,height:360});return pixels()};r.clear();const bg=pixels(),a=draw(1),b=draw(8),c=draw(1);test('文字が背景に合成される',a.some((v,i)=>v!==bg[i]));test('表示区間外は背景と完全一致',b.every((v,i)=>v===bg[i]));test('シークして戻っても同じ絵',a.every((v,i)=>v===c[i]));test('renderer状態を復元',r.autoClear===true);o.dispose();
const frame=document.createElement('iframe');frame.src='/app/sequence.html?empty&lyrics-test='+Date.now();frame.style.cssText='width:100%;height:680px';document.body.append(frame);await new Promise(resolve=>frame.onload=resolve);for(let i=0;i<1200&&!frame.contentWindow.unfoldSeq;i++)await new Promise(r=>setTimeout(r,50));const api=frame.contentWindow.unfoldSeq;test('歌詞・曲のかんたん操作UI',!!frame.contentDocument.querySelector('#lyric-motion-controls')); test('シーケンス連携API',typeof api?.setLyricDocument==='function');if(api?.setLyricDocument){api.setLyricDocument(d);test('背景なしでも仮見本12秒',api.totalSeconds()===12);const cvs=frame.contentDocument.querySelector('#seq-canvas');const capture=()=>cvs.toDataURL();api.renderAt(1);const text=capture();api.setLyricDocument({...d,enabled:false});api.renderAt(1);test('背景なしでも文字表示',text!==capture());const img=Object.assign(frame.contentDocument.createElement('canvas'),{width:640,height:360});const ix=img.getContext('2d');ix.fillStyle='#264b76';ix.fillRect(0,0,640,360);ix.fillStyle='#d78e68';ix.beginPath();ix.arc(320,180,110,0,Math.PI*2);ix.fill();api.addSlide(img,'月のサンプル');api.setLyricDocument(null);api.renderAt(1);const image=capture(),before=JSON.stringify(api.seq.transitions);api.setLyricDocument(d);api.renderAt(1);test('背景あり文字表示',image!==capture());api.setLyricDocument({...d,enabled:false});api.renderAt(1);test('文字OFFで元の背景pixel',image===capture());test('背景のtransition不変',JSON.stringify(api.seq.transitions)===before);await (await import('/tools/test/lyric-integration.js?v=4')).run(api,frame,test);await (await import('/tools/test/lyric-extra.js?v=1')).extra(api,frame,test);await (await import('/tools/test/lyric-review-browser.js?v=3')).reviewChecks(api,frame,test);}

}catch(e){test(e.message,false)}document.querySelector('#results').textContent=JSON.stringify(results,null,2);document.body.dataset.done='true';
</script>
