<!doctype html><meta charset="utf-8"><title>Motion library integration QA</title><pre id="results">検証中</pre><script type="module">
import {BUILTIN_MOTIONS} from '/app/lyric-recipe.js';import {parseLyrics} from '/app/lyric-document.js?v=2';
const checks=[],test=(name,pass)=>checks.push({name,pass:!!pass}),sleep=ms=>new Promise(r=>setTimeout(r,ms));
try{const iframe=document.createElement('iframe');iframe.style.cssText='width:1200px;height:780px';iframe.src='/app/sequence.html?empty&motion-library-test=1#lyric';document.body.append(iframe);await new Promise(r=>iframe.onload=r);for(let i=0;i<200&&!iframe.contentWindow.unfoldSeq;i++)await sleep(50);const api=iframe.contentWindow.unfoldSeq;if(!api)throw Error('sequence init missing');
 const d=parseLyrics('最初の*光*/明日へ\n次の歌詞');Object.assign(d.events[0],{s:0,e:5,timingSource:'manual'});Object.assign(d.events[1],{s:6,e:9,timingSource:'manual',locked:true,motion:{preset:'slide'}});api.setLyricDocument(d);
 await api.lyricAction({type:'recipe-apply',motion:BUILTIN_MOTIONS[5].motion});test('recipe applied to unlocked lines',api.seq.lyricDocument.events[0].motion?.recipe?.layout==='poster');test('locked line unchanged',api.seq.lyricDocument.events[1].motion.preset==='slide'&&!api.seq.lyricDocument.events[1].motion.recipe);test('timing unchanged',api.seq.lyricDocument.events[0].e===5);
 api.undo();test('undo recipe application',!api.seq.lyricDocument.events[0].motion?.recipe);api.redo();test('redo recipe application',api.seq.lyricDocument.events[0].motion?.recipe?.layout==='poster');
 await api.lyricAction({type:'text',value:'最初の*光*/明日へ\n次の歌詞\n追加'});test('typing preserves selected recipe',api.seq.lyricDocument.events[0].motion?.recipe?.layout==='poster');test('typing preserves timing',api.seq.lyricDocument.events[0].e===5);
 const blob=await api.exportProjectBlob();await api.openProjectFile(blob);test('project roundtrip embeds recipe',api.seq.lyricDocument.events[0].motion?.recipe?.layout==='poster');
 const button=[...iframe.contentDocument.querySelectorAll('button')].find(x=>x.textContent==='モーション集・自作');test('studio entry visible',!!button);button?.click();await sleep(100);test('studio opens',!!iframe.contentDocument.querySelector('dialog.motion-studio[open]'));test('AI prompt entry exists',!!iframe.contentDocument.querySelector('[data-action="ai-prompt"]'));iframe.contentDocument.querySelector('[data-action="close-studio"]')?.click();
}catch(e){test(e.stack||e.message,false)}document.querySelector('#results').textContent=JSON.stringify(checks,null,2);document.body.dataset.done='true';
</script>
