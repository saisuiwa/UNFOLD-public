<!doctype html><html lang="ja"><meta charset="utf-8"><title>フォント描画と再読み込み検証</title><pre id="results">検証中</pre><canvas width="1280" height="720" style="width:90vw"></canvas><script type="module">
import {savedLyricFonts,prepareLyricFont,lyricFontCSS} from '/app/lyric-fonts.js';import {parseLyrics,cleanLyricDocument} from '/app/lyric-document.js?v=3';import {createLyricPainter} from '/app/lyric-painter.js';import {compileLyricScene} from '/app/lyric-scene.js';import {BUILTIN_MOTIONS} from '/app/lyric-recipe.js';
const results=[],check=(name,pass)=>results.push({name,pass:!!pass});try{const fonts=savedLyricFonts(),file=fonts.find(f=>f.label==='Arial.ttf');check('imported font metadata survives reload',file);if(file){await prepareLyricFont(file.key);check('font bytes reload from IndexedDB',document.fonts.check(lyricFontCSS(file.key,64),'ABC'))}const local=fonts.find(f=>f.label.includes('あかずきん'));if(!local)throw Error('Select PC Japanese font first');await prepareLyricFont(local.key);let d=parseLyrics('ブラウザひとつで/できちゃうよ');d.events[0].motion={...BUILTIN_MOTIONS[4].motion,font:local.key,color:'#c5f57b'};d.events[0].colors=[{start:0,end:4,color:'#ff91c7'}];const e={...cleanLyricDocument(d).events[0],start:0,end:6},ctx=document.querySelector('canvas').getContext('2d');const scene=compileLyricScene(e,{width:1280,height:720,measure:(text,size,font)=>{ctx.font=lyricFontCSS(font,size);return ctx.measureText(text).width}});check('glyph count and order match text',scene.nodes.map(n=>n.text).join('')===e.text.replaceAll('\n',''));ctx.fillStyle='#101718';ctx.fillRect(0,0,1280,720);createLyricPainter().draw(ctx,e,2.5,{width:1280,height:720});results.push({nodes:scene.nodes.map(n=>({text:n.text,x:n.x,y:n.y}))});}catch(e){check(e.message,false)}document.querySelector('#results').textContent=JSON.stringify(results,null,2);
</script></html>
