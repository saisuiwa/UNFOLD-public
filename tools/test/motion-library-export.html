<!doctype html><meta charset="utf-8"><title>Motion export QA</title><pre id="result">準備中</pre><script type="module">
import {parseLyrics} from '/app/lyric-document.js?v=2';import {BUILTIN_MOTIONS} from '/app/lyric-recipe.js';
const frame=document.createElement('iframe');frame.width=1100;frame.height=700;frame.src='/app/sequence.html?empty&motion-export-test=1#lyric';document.body.append(frame);await new Promise(r=>frame.onload=r);const wait=ms=>new Promise(r=>setTimeout(r,ms));
