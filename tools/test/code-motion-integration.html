<!doctype html><meta charset="utf-8"><title>UNFOLD Code Motion Integration</title><style>body{background:#101819;color:#eaffde;font:16px system-ui}canvas,video{width:640px;max-width:100%}iframe{width:100%;height:750px}pre{white-space:pre-wrap}</style><h1>コードモーション統合検証</h1><canvas id="stage"></canvas><pre id="result">検証中</pre><script type="module">
import * as T from '/app/vendor/three.module.min.js';
import {parseLyrics} from '/app/lyric-document.js?v=3';
import {createLyricOverlay} from '/app/lyric-overlay.js';
import {CODE_MOTION_PRESETS} from '/app/code-motion-presets.js';
import {approveCodeMotion} from '/app/code-motion-format.js';
import {BUILTIN_MOTIONS} from '/app/lyric-recipe.js';
const result=document.querySelector('#result'),checks=[],test=(name,ok)=>{checks.push({name,pass:!!ok});result.textContent=JSON.stringify(checks,null,2)},wait=ms=>new Promise(r=>setTimeout(r,ms));
try{
 const r=new T.WebGLRenderer({canvas:document.querySelector('#stage'),preserveDrawingBuffer:true});r.setSize(640,360,false);r.setClearColor('#101819');let error='';const overlay=createLyricOverlay(r,{onError:e=>error=e.message});
 const pixels=()=>{const p=new Uint8Array(r.domElement.width*r.domElement.height*4);r.getContext().readPixels(0,0,r.domElement.width,r.domElement.height,6408,5121,p);return p},draw=async(d,t)=>{await overlay.prepareFrame(d,t,{duration:6,width:r.domElement.width,height:r.domElement.height,bpm:120});r.clear();overlay.render(d,t,{duration:6,bpm:120});return pixels()};
 r.clear();const bg=pixels();
 for(const p of CODE_MOTION_PRESETS){approveCodeMotion(p.source);const d=parseLyrics('小さな*光*を/明日へつなぐ');d.events[0].motion={code:{version:1,source:p.source}};await overlay.prepare(d);const a=await draw(d,2.1);await draw(d,4);const b=await draw(d,2.1);test(p.name+' visible',a.some((v,i)=>v!==bg[i]));test(p.name+' reverse seek exact',a.every((v,i)=>v===b[i]));const c=await draw(d,3.2);test(p.name+' sustain moves',a.some((v,i)=>v!==c[i]));r.setSize(1280,720,false);const large=await draw(d,2.1);test(p.name+' resize visible',large.some((v,i)=>i%4!==3&&v>80));r.setSize(640,360,false);const restored=await draw(d,2.1);test(p.name+' size restored',a.every((v,i)=>v===restored[i]));}
 for(const font of ['gothic','mincho','round','dela','marker','dot']){const d=parseLyrics('日本語の文字');d.events[0].motion={font,code:{version:1,source:CODE_MOTION_PRESETS[0].source}};await overlay.prepare(d);test(font+' local font draws',(await draw(d,2.1)).some((v,i)=>v!==bg[i]));}
 const blocked=parseLyrics('非承認');blocked.events[0].motion={code:{version:1,source:'throw Error("must not run")'}};let rejected=false;try{await overlay.prepare(blocked)}catch(e){rejected=e.message.includes('未確認')}test('unapproved source rejected before execution',rejected);
 const ordinary=parseLyrics('従来のレシピ');ordinary.events[0].motion=BUILTIN_MOTIONS[0].motion;await overlay.prepare(ordinary);test('recipe still draws',(await draw(ordinary,2.1)).some((v,i)=>v!==bg[i]));overlay.dispose();r.dispose();
 const f=document.createElement('iframe');f.src='/app/sequence.html?empty&code-qa='+Date.now();document.body.append(f);await new Promise(res=>f.onload=res);for(let i=0;i<300&&!f.contentWindow.unfoldSeq;i++)await wait(50);const api=f.contentWindow.unfoldSeq,d=parseLyrics('コードで*光*を/明日へつなぐ\n次の歌詞');Object.assign(d.events[0],{s:0,e:6,motion:{font:'dela',color:'#baffce',code:{version:1,source:CODE_MOTION_PRESETS[0].source}}});Object.assign(d.events[1],{s:7,e:10});api.setLyricDocument(d);await api.lyricAction({type:'select-lyric',id:d.events[0].id});await wait(1500);test('inline add button',!![...f.contentDocument.querySelectorAll('button')].find(b=>b.textContent.includes('＋ 追加・コード')));
 const project=await api.exportProjectBlob();await api.openProjectFile(project);test('project source roundtrip',api.seq.lyricDocument.events[0].motion.code.source===CODE_MOTION_PRESETS[0].source);
 await api.lyricAction({type:'lyric-style',id:d.events[0].id,patch:{code:null,recipe:BUILTIN_MOTIONS[0].motion.recipe}});test('switch back to recipe',!api.seq.lyricDocument.events[0].motion.code&&!!api.seq.lyricDocument.events[0].motion.recipe);await api.openProjectFile(project);
 result.textContent+='\nMP4を書き出し中';const blob=await api.exportVideo({fps:12,quality:720,look:'std',format:'mp4',from:1,to:2});test('MP4 export + recording restored',blob.size>1000&&!api.seq.recording);const video=document.createElement('video');video.controls=true;video.src=URL.createObjectURL(blob);document.body.prepend(video);await new Promise((resolve,reject)=>{video.onloadeddata=resolve;video.onerror=reject});await new Promise(resolve=>{video.onseeked=resolve;video.currentTime=.4});const decoded=document.createElement('canvas');decoded.width=video.videoWidth;decoded.height=video.videoHeight;const dc=decoded.getContext('2d');dc.drawImage(video,0,0);test('decoded MP4 has visible text and correct duration',video.videoWidth===1280&&video.videoHeight===720&&Math.abs(video.duration-1)<.1&&dc.getImageData(0,0,1280,720).data.some((v,i)=>i%4!==3&&v>140));const a=document.createElement('a');a.href=video.src;a.download='unfold-code-motion-qa.mp4';a.textContent='検証MP4を保存';document.body.prepend(a);const img=document.createElement('img');img.src=f.contentDocument.querySelector('#seq-canvas').toDataURL();img.width=640;document.body.prepend(img);
 document.body.dataset.done='true';test('no preview errors',!error);
}catch(e){test(e.stack||e.message,false);document.body.dataset.done='true'}
</script>
