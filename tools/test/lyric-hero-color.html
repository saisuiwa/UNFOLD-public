<!doctype html><meta charset="utf-8"><title>大きな輪郭文字の色</title><style>body{background:#101819;color:white;font:16px system-ui}canvas{width:800px;max-width:100%}</style><h1>元の文字色を、大きな輪郭文字にも</h1><canvas width="960" height="540"></canvas><pre id="results">検証中</pre><script type="module">
import {createLyricPainter,prepareMotionFont} from '/app/lyric-painter.js?v=9';
import {BUILTIN_MOTIONS} from '/app/lyric-recipe.js';
const c=document.querySelector('canvas'),ctx=c.getContext('2d',{willReadFrequently:true}),p=createLyricPainter(),motion=BUILTIN_MOTIONS.find(m=>m.id==='poster').motion,checks=[];
const event={text:'まわれ まわれ\n私の世界',runs:[{text:'ま',color:'#ff0000'},{text:'われ まわれ\n'},{text:'私',color:'#ff0000'},{text:'の世界'}],motion,start:0,end:6};
await prepareMotionFont(motion,event.text);
function draw(t){ctx.clearRect(0,0,960,540);p.draw(ctx,event,t,{width:960,height:540});return ctx.getImageData(0,0,432,540).data}
draw(2.5);const a=draw(2.5);let red=0;for(let i=0;i<a.length;i+=4)if(a[i]>150&&a[i+1]<80&&a[i+2]<80&&a[i+3]>20)red++;
checks.push({name:'giant outline follows first glyph red',pass:red>100});draw(4);const b=draw(2.5);checks.push({name:'reverse seek unchanged',pass:a.every((v,i)=>v===b[i]),differences:a.reduce((n,v,i)=>n+(v!==b[i]),0),maxDifference:a.reduce((n,v,i)=>Math.max(n,Math.abs(v-b[i])),0),alphaDifference:a.reduce((n,v,i)=>i%4===3?Math.max(n,Math.abs(v-b[i])):n,0)});document.querySelector('#results').textContent=JSON.stringify(checks,null,2);
</script>
