<!doctype html><meta charset="utf-8"><title>Code motion word colors</title><style>body{background:#101819;color:#efffea;font:16px system-ui}canvas{display:block;width:800px;max-width:100%}pre{white-space:pre-wrap}</style><h1>一文字・語句に分けたコードの色</h1><div id="frames"></div><pre id="results">検証中</pre><script type="module">
import {createCodeMotionRuntime} from '/app/code-motion-runtime.js';
import {parseLyrics} from '/app/lyric-document.js?v=3';
import {approveCodeMotion} from '/app/code-motion-format.js';
const text='まわれ まわれ\n私の世界',runs=[{text:'ま',color:'#ff0000'},{text:'われ '},{text:'ま',color:'#0000ff'},{text:'われ\n'},{text:'私',color:'#ff0000'},{text:'の世界'}];
const checks=[],check=(name,pass)=>{checks.push({name,pass});document.querySelector('#results').textContent=JSON.stringify(checks,null,2)};
const params={text,runs,width:960,height:320,fontSize:65,color:'#ffffff',accent:'#00ff00',duration:6};
const samples=[['全文',`api.createText(api.text);return {update(){}};`],['一文字（空白を飛ばす）',`[...api.text].forEach((c,i)=>{if(!c.trim())return;const t=api.createText(c);if(c==='ま'&&!t.colorRanges)throw Error('missing fragment ranges at '+i);t.position.x=(i-5.5)*65});return {update(){}};`],['語句（繰り返す言葉）',`api.text.split(/\\s+/).forEach((word,i)=>{const t=api.createText(word);t.position.x=(i-1)*270});return {update(){}};`],['直接指定した色',`const t=api.createText('われ',{color:'#00ff00'});return {update(){}};`],['明示的に色を固定',`api.createText(api.text,{color:'#00ff00',colorRanges:null});return {update(){}};`]];
try{for(const [name,source] of samples){const rt=createCodeMotionRuntime();await rt.prepare({...params,source});const b=await rt.render(2);const canvas=document.createElement('canvas');canvas.width=960;canvas.height=320;const ctx=canvas.getContext('2d');ctx.drawImage(b,0,0);b.close();document.querySelector('#frames').append(Object.assign(document.createElement('h2'),{textContent:name}),canvas);const p=ctx.getImageData(0,0,960,320).data;let red=0,blue=0,green=0;for(let i=0;i<p.length;i+=4){if(p[i+3]<160)continue;if(p[i]>150&&p[i+1]<70&&p[i+2]<70)red++;if(p[i+2]>150&&p[i]<70&&p[i+1]<70)blue++;if(p[i+1]>150&&p[i]<70&&p[i+2]<70)green++;}if(name.startsWith('直接')||name.startsWith('明示'))check(name+' preserved',green>50&&red===0&&blue===0);else{check(name+' selected red',red>50);check(name+' repeated occurrence blue',blue>50)}rt.dispose();}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const frame=document.createElement('iframe');frame.style.cssText='width:100%;height:600px';frame.src='/app/sequence.html?empty&color-qa='+Date.now();document.body.append(frame);await new Promise(r=>frame.onload=r);for(let i=0;i<200&&!frame.contentWindow.unfoldSeq;i++)await wait(50);const api=frame.contentWindow.unfoldSeq;
const source=samples[1][1];approveCodeMotion(source);const doc=parseLyrics(text.replace(/\n/g,'/'));doc.events[0].s=0;doc.events[0].e=6;doc.events[0].motion={code:{version:1,source}};api.setLyricDocument(doc);
await api.lyricAction({type:'word-color',id:doc.events[0].id,start:0,end:1,color:'#ff0000'});await api.lyricAction({type:'word-color',id:doc.events[0].id,start:4,end:5,color:'#0000ff'});
const output=await api.exportVideo({format:'mp4',fps:30,quality:720,look:'std',from:1,to:1.5});
const video=document.createElement('video');video.controls=true;video.src=URL.createObjectURL(output);document.body.append(video);await new Promise((r,j)=>{video.onloadeddata=r;video.onerror=j});await new Promise(r=>{video.onseeked=r;video.currentTime=.2});const canvas=document.createElement('canvas');canvas.width=video.videoWidth;canvas.height=video.videoHeight;const ctx=canvas.getContext('2d');ctx.drawImage(video,0,0);const pixels=ctx.getImageData(0,0,canvas.width,canvas.height).data;let red=0,blue=0;for(let i=0;i<pixels.length;i+=4){if(pixels[i]>140&&pixels[i+1]<80&&pixels[i+2]<80)red++;if(pixels[i+2]>140&&pixels[i]<80&&pixels[i+1]<80)blue++;}check('inline word-color reaches decoded MP4 red',red>100);check('second occurrence color reaches decoded MP4 blue',blue>100);check('export restores editor controls',!api.seq.recording);
document.body.dataset.done='true'}catch(e){check(e.stack,false)}
</script>
