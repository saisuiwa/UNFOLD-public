<!doctype html><meta charset="utf-8"><title>MultiText runtime QA</title><style>body{background:#182030;color:white}canvas{width:640px}</style><h1>MultiText runtime QA</h1><pre id="result">Running</pre><canvas></canvas><script type="module">
import {createCodeMotionRuntime} from '/app/code-motion-runtime.js';import {CODE_MOTION_PRESETS} from '/app/code-motion-presets.js';
const out=document.querySelector('pre'),c=document.querySelector('canvas'),ctx=c.getContext('2d');out.textContent='';
const runs=[{text:'小さな',emphasis:false},{text:'光',emphasis:true},{text:'を\n明日へつなぐ',emphasis:false}];
try{for(const size of [640,1280,640,1280]){out.textContent+='prepare '+size+'\n';const r=createCodeMotionRuntime({initializationTimeout:30000});await r.prepare({source:CODE_MOTION_PRESETS[2].source,text:runs.map(r=>r.text).join(''),runs,width:size,height:size*9/16,fontSize:size*9/16/720*112*64/72,color:'#ffffff',accent:'#d9f878',duration:6,bpm:120});out.textContent+='render '+size+'\n';const b=await r.render(2.1);c.width=b.width;c.height=b.height;ctx.drawImage(b,0,0);b.close();const p=ctx.getImageData(0,0,c.width,c.height).data;let count=0,max=0;for(let i=0;i<p.length;i+=4){if(p[i+3])count++;max=Math.max(max,p[i],p[i+1],p[i+2]);}out.textContent+=size+' count='+count+' max='+max+'\n';r.dispose();if(count===0||max<200)throw Error('blank or incorrect text fill color');}
const r=createCodeMotionRuntime();await r.prepare({source:`const t=api.createText(api.text);t.sync();return {update(){t.text='外部 sync の蒼鈴';t.sync();}}`,text:'initial',width:1280,height:720,fontSize:100,color:'#ffffff',duration:6});const b=await r.render(1);c.width=b.width;c.height=b.height;ctx.drawImage(b,0,0);b.close();if(!ctx.getImageData(0,0,c.width,c.height).data.some((v,i)=>i%4===3&&v))throw Error('external sync blank');r.dispose();out.textContent+='PASS external sync + ALL PASS';}catch(e){out.textContent+='FAIL '+e.stack;}
</script>
