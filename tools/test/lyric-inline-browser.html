<!doctype html><html lang="ja" translate="no"><meta charset="utf-8"><title>その場編集の検証</title><style>body{background:#111718;color:#edf2e5;font:14px sans-serif}iframe{width:100%;height:900px;border:0}pre{white-space:pre-wrap}</style><pre id="results">検証中</pre><script type="module">
import {parseLyrics} from '/app/lyric-document.js?v=3';import {BUILTIN_MOTIONS} from '/app/lyric-recipe.js';import {prepareLyricFont} from '/app/lyric-fonts.js';
const tests=[],check=(name,pass)=>tests.push({name,pass:!!pass}),wait=ms=>new Promise(r=>setTimeout(r,ms));const f=document.createElement('iframe');f.src='/app/sequence.html?empty&inline-qa=1#lyric';document.body.append(f);await new Promise(r=>f.onload=r);
try{for(let i=0;i<200&&!f.contentWindow.unfoldSeq;i++)await wait(50);const api=f.contentWindow.unfoldSeq,d=parseLyrics('ブラウザひとつで/できちゃうよ\n次の歌詞');Object.assign(d.events[0],{s:0,e:6,motion:BUILTIN_MOTIONS[0].motion});Object.assign(d.events[1],{s:7,e:10,locked:true});api.setLyricDocument(d);
 await api.lyricAction({type:'select-lyric',id:d.events[0].id});check('timeline selection reveals inline inspector',!f.contentDocument.querySelector('#lm-quick').hidden&&f.contentDocument.querySelector('#lm-quick textarea').value===d.events[0].text);check('six motion buttons live beside main preview',f.contentDocument.querySelectorAll('.lq-motion').length===6&&!f.contentDocument.querySelector('dialog[open]'));
 await api.lyricAction({type:'lyric-style',id:d.events[0].id,patch:{color:'#ff91c7',font:'local:Arial-BoldMT'}});await api.lyricAction({type:'lyric-style',id:d.events[0].id,patch:{recipe:BUILTIN_MOTIONS[4].motion.recipe},replay:true});check('motion tap keeps color and PC font',api.seq.lyricDocument.events[0].motion.color==='#ff91c7'&&api.seq.lyricDocument.events[0].motion.font==='local:Arial-BoldMT');check('motion tap starts selected line',api.seq.playing&&api.seq.t<6);await api.lyricAction({type:'pause'});
 await api.lyricAction({type:'word-color',id:d.events[0].id,start:0,end:4,color:'#78ddff'});check('selected word only changes',api.seq.lyricDocument.events[0].runs[0].text==='ブラウザ'&&api.seq.lyricDocument.events[0].runs[0].color==='#78ddff'&&!api.seq.lyricDocument.events[0].runs[1].color);api.undo();check('partial color undo',!api.seq.lyricDocument.events[0].colors?.length);api.redo();check('partial color redo',api.seq.lyricDocument.events[0].colors?.length===1);
 await api.lyricAction({type:'lyric-style',id:d.events[0].id,scope:'all',patch:{color:'#c5f57b',emphasisColor:'#ffb454',font:'gothic'}});check('bulk color includes locked line without altering timing or motion',api.seq.lyricDocument.events.every(e=>e.motion.color==='#c5f57b')&&api.seq.lyricDocument.events[1].locked&&api.seq.lyricDocument.events[0].e===6&&api.seq.lyricDocument.events[0].motion.recipe.layout==='assemble');
 const blob=await api.exportProjectBlob();await api.openProjectFile(blob);check('project keeps word colors',api.seq.lyricDocument.events[0].runs[0].color==='#78ddff');await api.lyricAction({type:'text',value:api.seq.lyricDocument.sourceText+'\n追加'});check('neighboring edit keeps word colors',api.seq.lyricDocument.events[0].runs[0].color==='#78ddff');
 const {parseMotionFile,buildMotionFile}=await import('/app/lyric-library.js');const localMotion={...BUILTIN_MOTIONS[0].motion,font:'local:Arial-BoldMT'};check('motion file retains PC font reference',parseMotionFile(buildMotionFile({name:'PC書体',motion:localMotion})).motion.font===localMotion.font);
 let missing=false;try{await prepareLyricFont('file:'+'0'.repeat(64))}catch{missing=true}check('missing font is explicit error',missing);
 await api.lyricAction({type:'select-lyric',id:d.events[0].id});
 const b=document.createElement('button');b.textContent='色とPC書体でMP4を書き出す';document.body.prepend(b);b.onclick=async()=>{try{b.disabled=true;const blob=await api.exportVideo({format:'mp4',fps:30,quality:720,look:'std',from:1.5,to:3.5});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='unfold-inline-fonts-qa.mp4';a.textContent='検証動画を保存';document.body.prepend(a);b.textContent='MP4完了 '+blob.size+' bytes'}catch(e){b.textContent=e.message}finally{b.disabled=false}};
}catch(e){check(e.stack||e.message,false)}document.querySelector('#results').textContent=JSON.stringify(tests,null,2);
</script></html>
