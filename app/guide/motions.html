</style></head><body><header class="top"><div class="top-in"><a class="brand" href="../"><b>◈</b>UNFOLD</a><nav aria-label="ページ"><a href="./">説明</a><a href="./methods.html">メソッド集</a><a href="./samples.html">サンプル集</a><a href="./motions.html" aria-current="page">モーション集</a><a href="./glb.html">GLB置き場</a><a href="../lyric-sync/index.html">歌詞タイミング</a><a href="../workshop.html">メソッド工房</a></nav><span class="spacer"></span><a class="btn small lime" href="../sequence.html#lyric">歌詞MVで使う</a></div></header><main><div class="eyebrow">TEXT MOTIONS</div><h1>文字が、演出になる。</h1><p class="lede">言葉の配置に、登場・表示中・退場の動きを重ねる。見本から選んで、自分のモーションも作れます。</p><div class="motion-showcase"><div><canvas id="motion-preview" width="1280" height="720" aria-label="選んだモーションの見本"></canvas><div class="motion-actions"><button id="motion-play" class="btn">一時停止</button><button id="motion-restart" class="btn">最初から再生</button><button id="motion-sustain" class="btn">表示中から再生</button></div><label for="preview-words">自分の言葉で試す（/ で改行、*言葉* で強調）</label><textarea id="preview-words" maxlength="2000" rows="2">小さな*光*を/明日へつなぐ</textarea><div class="motion-actions"><button id="motion-add" class="btn lime">UNFOLDに追加</button><button id="motion-edit" class="btn">組み合わせて作る</button><button id="motion-download" class="btn">ファイルに保存</button></div><p id="motion-status" role="status"></p><p class="note">追加した動きは、同じブラウザの「歌詞・曲 → モーション集・自作」で選べます。別の端末へはモーションファイルを渡せます。保存するのは動きだけで、歌詞・曲・画像は含みません。</p></div><div id="motion-choices" class="motion-choices"></div></div></main><script type="module" src="./motions.js?v=2"></script></body></html>
