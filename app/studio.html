<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UNFOLD / STUDIO</title><link rel="stylesheet" href="studio.css"></head><body><main id="studio"><p>STUDIOを準備しています…</p></main><script type="module">import {openStudioStore} from './studio/store.js';import {createController} from './studio/controller.js';import {mountStudio} from './studio/view.js';try{const controller=createController({store:await openStudioStore()});mountStudio(document.getElementById('studio'),controller);await controller.ready;addEventListener('pagehide',()=>controller.dispose());}catch(e){document.getElementById('studio').textContent='STUDIOを開けません：'+e.message;}</script></body></html>
