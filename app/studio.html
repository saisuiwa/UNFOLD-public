<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UNFOLD / STUDIO</title><link rel="stylesheet" href="studio.css"><link rel="stylesheet" href="lyric-controls.css?v=3"></head><body><main id="studio"><p>STUDIOを準備しています…</p></main><script type="module">import {openStudioStore} from './studio/store.js';import {createController} from './studio/controller.js';import {mountStudio} from './studio/view.js';try{const controller=createController({store:await openStudioStore()});mountStudio(document.getElementById('studio'),controller);await controller.ready;if(new URLSearchParams(location.search).get('from')==='sequence'){try{await controller.openHandoff();}catch(e){controller.notify(e.message||'シーケンスの作品を開けませんでした');}history.replaceState(null,'',location.pathname);}addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')controller.flush().catch(()=>{});});addEventListener('beforeunload',e=>{const s=controller.get();if(s.unsaved&&(s.readOnly||s.saveStatus==='保存失敗')){e.preventDefault();e.returnValue='';}});addEventListener('pagehide',()=>controller.dispose());}catch(e){document.getElementById('studio').textContent='STUDIOを開けません：'+e.message;}</script></body></html>
